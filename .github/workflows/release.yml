name: Release

# Push a tag like `v0.1.0` to build all packages and publish a GitHub Release.
# "Run workflow" (manual) builds the same packages as downloadable artifacts only.
#
# The in-app updater (crates/dotnote-core/src/update.rs) looks for these exact
# asset names in the latest release, plus SHA256SUMS:
#   Dotnote-macos-arm64.zip, Dotnote-windows-x64.zip, Dotnote-fedora-x86_64.rpm
# The .dmg and the Windows setup.exe are for first installs only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $cargo_version"
            exit 1
          fi

  macos:
    name: macOS (.dmg, .zip)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/release/bundle/macos/*.dmg
            target/release/bundle/macos/*.zip

  windows:
    name: Windows (.zip, setup.exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dotnote
      - name: Zip the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/dotnote.exe dist/Dotnote.exe
          Compress-Archive -Path dist/Dotnote.exe -DestinationPath Dotnote-windows-x64.zip
      # The installer is for first installs; the updater uses the zip.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc /DAppVersion=$version "/DSourceExe=$PWD\target\release\dotnote.exe" packaging\windows\dotnote.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Dotnote-windows-x64.zip
            Dotnote-*-setup.exe

  fedora:
    name: Fedora (.rpm)
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git gcc gcc-c++ clang cmake pkgconf-pkg-config \
            fontconfig-devel wayland-devel webkit2gtk4.1-devel \
            libxkbcommon-x11-devel libxcb-devel libX11-devel \
            openssl-devel libzstd-devel vulkan-loader-devel
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dotnote
      - run: cargo install cargo-generate-rpm --locked
      - run: cargo generate-rpm -p crates/dotnote
      # A fixed name, so the updater can find it in any release.
      - run: cp target/generate-rpm/*.rpm Dotnote-fedora-x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: Dotnote-fedora-x86_64.rpm

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The updater installs a package only if its checksum matches this file.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
